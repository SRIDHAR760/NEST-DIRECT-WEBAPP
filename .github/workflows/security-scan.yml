name: Vulnerability Scan

# NOTE ON SCOPE: "Vulnerability testing" is not implemented as hand-written
# unit tests here. Real-world security testing uses vetted scanners that each
# run hundreds of internal checks against known CVE databases, OWASP Top 10
# patterns, and secret-leak signatures. Writing custom "test cases" that
# reinvent these checks would be both less thorough and less trustworthy than
# using the tools the security industry actually relies on. This workflow
# wires up four such scanners:
#   1. npm audit          - dependency CVE scanning (hundreds of advisories)
#   2. CodeQL              - GitHub's static analysis engine (SAST), runs its
#                            own large query suite against JS/TS source
#   3. Gitleaks             - scans full git history for committed secrets/keys
#      (relevant here since API keys have been pasted around a lot)
#   4. OWASP ZAP Baseline  - passive DAST scan against your live deployed URL,
#                            checks for missing security headers, exposed
#                            info, common web vulnerabilities (OWASP Top 10)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 3am UTC
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Vulnerability Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zap-baseline:
    name: OWASP ZAP Baseline Scan (live site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://nest-direct-webapp.vercel.app/'
          cmd_options: '-a'
          fail_action: false  # set true once you've triaged the initial findings
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
