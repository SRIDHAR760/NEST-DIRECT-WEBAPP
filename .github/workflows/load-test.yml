name: Load Test (k6)

on:
  workflow_dispatch:
    inputs:
      include_api_load:
        description: 'Also load-test /api/chat (uses real Gemini quota — see script comments before enabling)'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * 0'  # weekly, Sunday — load tests are heavy, not run on every push

jobs:
  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/load-test.js
        env:
          BASE_URL: 'https://nest-direct-webapp.vercel.app'
          INCLUDE_API_LOAD: ${{ github.event.inputs.include_api_load || 'false' }}

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: summary.json
        continue-on-error: true
