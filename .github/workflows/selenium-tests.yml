name: Selenium E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'  # daily smoke run against production
  workflow_dispatch:

jobs:
  selenium:
    name: Selenium (Chrome headless)
    runs-on: ubuntu-latest
    env:
      BASE_URL: 'https://nest-direct-webapp.vercel.app'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install -r tests/selenium/requirements.txt

      - name: Run Selenium test suite
        run: |
          cd tests/selenium
          pytest -v --html=report.html --self-contained-html -n auto

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: tests/selenium/report.html
