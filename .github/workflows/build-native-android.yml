name: Build Native Android App

on:
  push:
    branches: [main]
    paths:
      - 'nestdirect-android/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nestdirect-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "::error::app/google-services.json is missing. See app/google-services.json.SETUP_INSTRUCTIONS.md — the build cannot succeed without it."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NestDirect-native-debug-apk
          path: nestdirect-android/app/build/outputs/apk/debug/app-debug.apk
